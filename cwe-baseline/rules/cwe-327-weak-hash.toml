schema_version = 1
id = "cwe-327-weak-hash"
title = "Weak cryptographic hash"
description = "MD5 and SHA-1 are broken (CWE-327) for collision resistance, so a value hashed with either cannot be relied on to identify or authenticate what produced it."
mode = "block"
severity = "high"
remediation = "Use a current cryptographic primitive; use Argon2 or scrypt for passwords."
evaluation = { kind = "deterministic", predicate = { kind = "cwe_regex", cwe_id = "CWE-327", path_glob = "**/*", pattern = "(?i)\\b(md5|sha1)\\s*\\(", requires_full_content = false, severity = "high" } }

[[examples]]
expected = "violation"
input = { kind = "content", path = "src/digest.py", content = "digest = md5(payload)", coverage = "fragment" }

[[examples]]
expected = "violation"
input = { kind = "content", path = "src/digest.py", content = "digest = sha1(payload)", coverage = "fragment" }

[[examples]]
expected = "ok"
note = "SHA-256 is not in the pattern and is a current primitive."
input = { kind = "content", path = "src/digest.py", content = "digest = sha256(payload)", coverage = "fragment" }
