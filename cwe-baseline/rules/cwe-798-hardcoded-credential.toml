schema_version = 1
id = "cwe-798-hardcoded-credential"
title = "Hardcoded credential"
description = "A literal secret in source (CWE-798) is readable by everyone who can read the file, survives in git history after it is removed, and cannot be rotated without a code change."
mode = "block"
severity = "high"
remediation = "Remove the literal credential and load it from a secret store."
evaluation = { kind = "deterministic", predicate = { kind = "cwe_regex", cwe_id = "CWE-798", path_glob = "**/*", pattern = "(?i)(api[_-]?key|secret|password)\\s*[:=]\\s*[\"'][^\"'\\n]{8,}[\"']", requires_full_content = false, severity = "high" } }

[[examples]]
expected = "violation"
input = { kind = "content", path = "src/client.ts", content = "const apiKey = \"sk-live-9f2a7c41bd\"", coverage = "fragment" }

[[examples]]
expected = "violation"
input = { kind = "content", path = "config/settings.py", content = "password = \"correct-horse-battery\"", coverage = "fragment" }

[[examples]]
expected = "ok"
note = "Reading the value from the environment is the remediation, not a violation."
input = { kind = "content", path = "src/client.ts", content = "const apiKey = process.env.API_KEY", coverage = "fragment" }
